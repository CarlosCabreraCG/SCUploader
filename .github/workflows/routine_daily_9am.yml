name: Tarea Diaria - 9:00 AM UTC

on:
  #schedule:
    #- cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  run-daily:
    runs-on: ubuntu-latest

    steps:
      # Actualizado a v4.2+ para soporte nativo de nuevos runtimes
      - name: Descargar repositorio
        uses: actions/checkout@v4.2.2

      # Actualizado a v5.4+ / v6
      - name: Configurar Python + Caché
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar librerías
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Genera ambos archivos independientes en la raíz del entorno virtual
      - name: Crear archivos de entorno
        run: |
          echo "${{ secrets.ENV_P1 }}" > .env.p1
          echo "${{ secrets.ENV_P2 }}" > .env.p2

      - name: Ejecutar con env.p1
        run: |
          python main.py --env-file .env.p1 transfer

      - name: Esperar 5 segundos
        run: sleep 5

      - name: Ejecutar con env.p2
        run: |
          python main.py --env-file .env.p2 transfer
